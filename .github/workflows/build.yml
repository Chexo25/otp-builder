name: Build OTP Graph
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - run: |
          curl -L --retry 3 -o centre.osm.pbf https://download.openstreetmap.fr/extracts/europe/france/centre-latest.osm.pbf
          java -Xmx12G -jar otp-2.5.0-shaded.jar --build --save .
      - uses: actions/upload-artifact@v4
        with: { name: graph, path: graph.obj }